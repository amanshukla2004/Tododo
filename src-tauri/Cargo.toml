[package]
name = "tododo"
version = "0.1.0"
description = "Ambient lightweight desktop to-do widget"
authors = ["you"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "tododo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
