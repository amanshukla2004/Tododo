[package]
name = "tododo"
version = "0.1.0"
description = "Ambient lightweight desktop to-do widget"
authors = ["you"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "tododo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.33", features = ["bundled-windows"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
