<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tododo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Dynamic Island Capsule (Collapsed Mode) -->
  <aside class="glance-pill" id="glance-pill" data-tauri-drag-region>
    <div class="glance-left" data-tauri-drag-region>
      <div class="glance-ring-wrapper" data-tauri-drag-region>
        <svg class="glance-ring" viewBox="0 0 36 36">
          <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path class="ring-progress" id="glance-progress-path" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <span class="glance-count" id="glance-count">0</span>
      </div>
      <span class="glance-title" id="glance-title" data-tauri-drag-region>All caught up! 🎉</span>
    </div>
    <div class="glance-actions">
      <button class="pill-expand-btn" id="btn-glance-expand" title="Expand to Widget" aria-label="Expand">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </aside>

  <!-- Authentic Obsidian Phone Widget Slab -->
  <main class="phone-widget" id="widget-canvas" data-tauri-drag-region>
    <!-- Widget Top Header (Natural Drag Surface) -->
    <header class="widget-head" data-tauri-drag-region>
      <div class="head-left" data-tauri-drag-region>
        <div class="widget-avatar-icon" data-tauri-drag-region>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="head-meta" data-tauri-drag-region>
          <span class="head-date" id="widget-date-display" data-tauri-drag-region>TODAY</span>
          <span class="head-title" data-tauri-drag-region>Reminders</span>
        </div>
      </div>

      <div class="head-right" data-tauri-drag-region>
        <span class="badge-count" id="canvas-task-stats" data-tauri-drag-region>0</span>
        <button class="head-control-btn" id="btn-toggle-pin" title="Toggle Pin Always-On-Top" aria-label="Pin">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-2l-2-3V6a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v6l-2 3v2z"/></svg>
        </button>
        <button class="head-control-btn" id="btn-collapse" title="Collapse to Dynamic Island" aria-label="Collapse">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="head-control-btn btn-close-cross" id="btn-close" title="Hide to System Tray" aria-label="Close">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Task List -->
    <div class="widget-scroller" id="task-scroller">
      <div class="tasks-group" id="tasks-container"></div>

      <!-- Inline Fast Add (Just like phone widgets) -->
      <form class="inline-add-row" id="task-creator-form">
        <button type="submit" class="inline-add-btn" id="btn-submit-task" title="Add reminder" aria-label="Add task">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <input
          type="text"
          id="task-title-input"
          class="inline-add-input"
          placeholder="New reminder... (Enter to save)"
          autocomplete="off"
          required
        />
        <div class="prio-tag-button" id="prio-toggle-btn" title="Cycle Priority: Low / Medium / High">
          <span class="prio-indicator-dot" id="prio-dot"></span>
          <span class="prio-indicator-label" id="prio-label">Normal</span>
        </div>
      </form>
    </div>

    <!-- Phone Widget Bottom Status & Progress -->
    <footer class="widget-bottom" data-tauri-drag-region>
      <div class="progress-track" data-tauri-drag-region>
        <div class="progress-fill" id="progress-bar-fill"></div>
      </div>
      <div class="bottom-meta" data-tauri-drag-region>
        <span class="bottom-stats-text" id="footer-progress-text" data-tauri-drag-region>0 completed</span>
        <button class="bottom-action-btn" id="btn-clear-completed" title="Clear completed tasks">Clear Done</button>
      </div>
    </footer>
  </main>

  <!-- Quick Feedback Toast -->
  <div class="toast-card" id="toast-notification">
    <span class="toast-txt" id="toast-message">Task updated</span>
    <button class="toast-undo" id="toast-undo-btn">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
